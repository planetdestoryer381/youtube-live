name: Mysterium Node Test

on:
  workflow_dispatch:

jobs:
  run-node:
    runs-on: ubuntu-latest

    steps:
      - name: Update system
        run: sudo apt update

      - name: Ensure Docker is running
        run: sudo systemctl start docker

      - name: Get Public IP
        run: |
          echo "Public IP:"
          curl -s ifconfig.me

      - name: Run Mysterium Node (auto-restart)
        run: |
          docker run -d \
            --name mysterium-node \
            --restart unless-stopped \
            -p 4449:4449 \
            -v myst-data:/var/lib/mysterium-node \
            mysterium/mysterium-node:latest

      - name: Show running containers
        run: docker ps

      - name: Show logs
        run: docker logs mysterium-node --tail 50

      - name: Keep runner alive (6 hours max)
        run: sleep 21600