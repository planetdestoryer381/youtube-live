name: Mysterium Node Test

on:
  workflow_dispatch:

jobs:
  run-node:
    runs-on: ubuntu-latest

    steps:
      - name: Update system
        run: sudo apt update

      - name: Start Docker
        run: sudo systemctl start docker

      - name: Get Public IP
        run: |
          echo "Public IP:"
          curl -s ifconfig.me

      - name: Pull and Run Mysterium Node
        run: |
          # Pull the correct image
          docker pull mysteriumnetwork/myst:latest

          # Run node in detached mode
          docker run -d \
            --cap-add NET_ADMIN \
            --name myst-node \
            --restart unless-stopped \
            -p 4449:4449 \
            -v myst-data:/var/lib/mysterium-node \
            mysteriumnetwork/myst:latest \
            service --agreed-terms-and-conditions

      - name: Show running containers
        run: docker ps

      - name: Show logs (tail)
        run: docker logs myst-node --tail 50

      - name: Keep runner alive (6 hours max)
        run: sleep 21600