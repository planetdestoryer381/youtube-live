name: Public IP Test with Sleep

on:
  workflow_dispatch:

jobs:
  show-ip:
    runs-on: ubuntu-latest

    steps:
      - name: Print Runner Info
        run: |
          echo "===== RUNNER INFO ====="
          hostname
          uname -a

      - name: Get Public IP
        run: |
          echo "Public IP of runner:"
          curl -s ifconfig.me

      - name: Disable Firewall
        run: |
          echo "Disabling UFW firewall..."
          sudo ufw disable || echo "UFW not installed"
          sudo systemctl stop firewalld || echo "firewalld not installed"
          sudo iptables -F
          sudo iptables -X
          sudo iptables -t nat -F
          sudo iptables -t nat -X
          sudo iptables -t mangle -F
          sudo iptables -t mangle -X
          echo "All firewall rules flushed"

      - name: Display Test Page Content
        run: |
          echo "<h1>TEST SITE</h1><p>This is running on public IP: $(curl -s ifconfig.me)</p>" > test.html
          cat test.html

      - name: Keep Runner Alive (6 hours max)
        run: |
          echo "Sleeping to keep runner alive..."
          sleep 21600