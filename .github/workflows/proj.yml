name: Mysterium Node Monitor

on:
  workflow_dispatch:

jobs:
  run-node:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repo
      - uses: actions/checkout@v3

      # Update system & install docker safely
      - name: Update system and install Docker
        run: |
          sudo apt update
          sudo apt install -y docker.io curl
          sudo systemctl start docker

      # Pull & run Mysterium Node (if not already running)
      - name: Run Mysterium Node
        run: |
          if ! docker ps | grep myst-node; then
            docker run -d \
              --name myst-node \
              --restart unless-stopped \
              -p 4449:4449 \
              -v myst-data:/var/lib/mysterium-node \
              mysteriumnetwork/mysterium-node:latest
          fi

      # Wait a few seconds for node to start
      - name: Wait for node
        run: sleep 10

      # Get public IP
      - name: Get Public IP
        run: echo "IP=$(curl -s ifconfig.me)" >> $GITHUB_ENV

      # Grab last 50 logs
      - name: Grab node logs
        run: |
          LOGS=$(docker logs myst-node --tail 50)
          echo "LOGS=$LOGS" >> $GITHUB_ENV

      # Create status.json
      - name: Create status.json
        run: |
          echo "{\"ip\":\"${IP}\",\"status\":\"running\",\"logs\":\"${LOGS}\"}" > status.json

      # Commit & push status.json back to GitHub
      - name: Commit & push status.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "Update node status" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main