name: Internet Speed Test

on:
  workflow_dispatch:

jobs:
  speedtest:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Install Speedtest CLI
        run: |
          curl -L -o speedtest.tgz https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-linux-x86_64.tgz
          tar -xzf speedtest.tgz
          chmod +x speedtest
          sudo mv speedtest /usr/local/bin/

      - name: Run Speedtest
        run: |
          speedtest --accept-license --accept-gdpr --format=json > result.json
          cat result.json

      - name: Pretty Output
        run: |
          DOWNLOAD=$(jq '.download.bandwidth' result.json)
          UPLOAD=$(jq '.upload.bandwidth' result.json)
          PING=$(jq '.ping.latency' result.json)
          ISP=$(jq -r '.isp' result.json)
          IP=$(jq -r '.interface.externalIp' result.json)
          SERVER=$(jq -r '.server.name' result.json)
          LOCATION=$(jq -r '.server.location' result.json)

          echo "ISP: $ISP"
          echo "IP: $IP"
          echo "Server: $SERVER ($LOCATION)"
          echo "Ping: $PING ms"
          echo "Download: $(($DOWNLOAD * 8 / 1000000)) Mbps"
          echo "Upload: $(($UPLOAD * 8 / 1000000)) Mbps"