name: Mysterium Node Status Update

on:
  workflow_dispatch:        # manual trigger
  schedule:
    - cron: '*/5 * * * *'  # automatic every 5 minutes (optional)

jobs:
  update-node-status:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v3

      # Step 2: Install Docker safely + curl
      - name: Install Docker and curl
        run: |
          sudo apt update
          sudo apt install -y curl
          curl -fsSL https://get.docker.com -o get-docker.sh
          sh get-docker.sh
          sudo systemctl start docker

      # Step 3: Ensure Mysterium Node is running
      - name: Run Mysterium Node if not running
        run: |
          docker ps | grep myst-node || docker run -d \
            --name myst-node \
            --restart unless-stopped \
            -p 4449:4449 \
            -v myst-data:/var/lib/mysterium-node \
            mysterium/myst-node:latest

      # Step 4: Get public IP
      - name: Get public IP
        id: get-ip
        run: |
          IP=$(curl -s ifconfig.me)
          echo "IP=$IP" >> $GITHUB_ENV

      # Step 5: Fetch last 20 lines of node logs
      - name: Fetch node logs
        id: get-logs
        run: |
          LOGS=$(docker logs myst-node --tail 20 2>/dev/null | sed 's/"/\\"/g' | tr '\n' '\\n')
          echo "LOGS=$LOGS" >> $GITHUB_ENV

      # Step 6: Write status.json
      - name: Write status.json
        run: |
          echo "{
            \"ip\": \"$IP\",
            \"status\": \"running\",
            \"logs\": \"$LOGS\"
          }" > status.json

      # Step 7: Commit & push status.json
      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "Update node status" || echo "No changes to commit"
          git push